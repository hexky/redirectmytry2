<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyTry Groups | SA-MP Community by Hexky</title>
  <meta name="description" content="Join MyTry Groups, the ultimate SA-MP community by Hexky. Connect, play, and grow with us!">
  
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://mytry.gta.cx/">
  <meta property="og:title" content="MyTry Groups | SA-MP Community by Hexky">
  <meta property="og:description" content="Join MyTry Groups, the ultimate SA-MP community by Hexky. Connect, play, and grow with us!">
  <meta property="og:image" content="https://mytry.cc.cd/assets/banner.jpg">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="MyTry Groups | SA-MP Community by Hexky">
  <meta name="twitter:description" content="Join MyTry Groups, the ultimate SA-MP community by Hexky. Connect, play, and grow with us!">
  <meta name="twitter:image" content="https://mytry.cc.cd/assets/banner.jpg">

  <meta name="robots" content="noindex, nofollow">

  <script>
    (function () {
      var TARGET = "https://mytry.cc.cd";
      var dest = TARGET
        + window.location.pathname
        + window.location.search
        + window.location.hash;
      window.location.replace(dest);
    })();
  </script>

  <noscript>
    <meta http-equiv="refresh" content="0; url=https://mytry.cc.cd">
  </noscript>

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }
    .wrap {
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .box {
      max-width: 420px;
    }
    .spinner {
      width: 42px;
      height: 42px;
      margin: 0 auto 20px;
      border: 4px solid rgba(255,255,255,0.15);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 1.15rem;
      font-weight: 600;
      margin: 0 0 8px;
    }
    p {
      font-size: 0.9rem;
      color: #94a3b8;
      margin: 0 0 12px;
      line-height: 1.5;
    }
    a {
      color: #38bdf8;
      text-decoration: none;
      word-break: break-all;
    }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="box">
      <div class="spinner"></div>
      <h1>Mengalihkan ke MyTry Groups…</h1>
      <p>
        Kamu akan diarahkan ke
        <a href="https://mytry.cc.cd">https://mytry.cc.cd</a>.
        Jika tidak otomatis, klik tautan tersebut.
      </p>
    </div>
  </div>

  <script>
    setTimeout(function () {
      var target = "https://mytry.cc.cd"
        + window.location.pathname
        + window.location.search
        + window.location.hash;
      if (window.location.href !== target) {
        window.location.href = target;
      }
    }, 1500);
  </script>
</body>
</html>
